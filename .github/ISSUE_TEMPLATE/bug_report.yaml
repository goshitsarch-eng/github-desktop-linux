name: 🐛 Linux bug report
description: Report a reproducible problem with this repository's Linux build
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with this unofficial Linux fork. Read the [installation guide](https://github.com/goshitsarch-eng/github-desktop-linux/blob/main/docs/installation.md) and [known issues](https://github.com/goshitsarch-eng/github-desktop-linux/blob/main/docs/known-issues.md), then search existing issues. For GitHub.com account/service problems, contact [GitHub Support](https://support.github.com/). Report security vulnerabilities privately according to the [security policy](https://github.com/goshitsarch-eng/github-desktop-linux/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Release version
      description: Use Help > About GitHub Desktop or provide the release tag.
      placeholder: "Example: 3.x.x or release tag"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - AppImage
        - Release tarball
        - Locally built DEB
        - Locally built RPM
        - Development/source build
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64 (x86_64)
        - arm64 (aarch64)
        - Other
    validations:
      required: true
  - type: input
    id: linux
    attributes:
      label: Linux distribution and version
      placeholder: "Example: Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment and session
      description: Include desktop version and X11, XWayland, or Wayland when known.
      placeholder: "Example: GNOME 46 on Wayland"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what you expected and what happened instead. Include exact error messages.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or terminal output
      description: Use Help > Show Logs. Remove tokens, private URLs, usernames, and sensitive paths before attaching files.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, asset filename, keyring provider, GPU, or other relevant details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I installed or built this repository's Linux version, not an unrelated package.
          required: true
        - label: I searched existing issues and reviewed the known-issues page.
          required: true
        - label: I removed secrets and private information from logs and screenshots.
          required: true
