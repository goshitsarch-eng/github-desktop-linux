name: ⭐ Feature request
description: Suggest an improvement to this Linux fork
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This repository focuses on Linux packaging and integration for GitHub Desktop. Search existing issues first. Cross-platform product requests may belong in the [upstream GitHub Desktop repository](https://github.com/desktop/desktop/issues); GitHub.com feedback belongs in [GitHub's feedback discussions](https://github.com/orgs/community/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What Linux user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and why it belongs in this fork.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds or upstream behavior.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, package/distribution details, or relevant links.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This request concerns this Linux fork rather than GitHub.com support.
          required: true
