name: Native GTK 4

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native-gtk.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-gtk.yml'

jobs:
  test:
    name: pytest + xvfb GTK smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, Adwaita, Git, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 gir1.2-secret-1 git xvfb xauth python3-pytest
      - name: Run unit and git integration tests
        working-directory: native
        run: PYTHONPATH=. python3 -m pytest tests -q --ignore=tests/test_gtk_smoke.py
      - name: Run GTK smoke tests
        working-directory: native
        run: xvfb-run -a env GTK_A11Y=none ADW_DISABLE_PORTAL=1 PYTHONPATH=. python3 -m pytest tests/test_gtk_smoke.py -q
