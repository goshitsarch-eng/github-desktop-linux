name: Linux Release

on:
  push:
    tags:
      - 'v*' # Matches v1.0.0, v2.0.0-beta, etc.
      - 'release-*' # Matches release-3.5.4-linux1

permissions:
  contents: write

jobs:
  build:
    name: Native GTK meson tarball
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install meson and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3 python3-gi

      - name: Configure and install into DESTDIR
        working-directory: native
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR="${GITHUB_WORKSPACE}/dist/staging" meson install -C build

      - name: Get version
        id: version
        run: |
          echo "version=$(PYTHONPATH=native python3 -c 'from github_desktop.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create prefix tarball
        run: |
          cd dist/staging
          tar -czvf "../GitHubDesktop-linux-native-${{ steps.version.outputs.version }}.tar.gz" usr
          ls -la ../

      - name: Upload native tarball
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/GitHubDesktop-linux-native-*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
