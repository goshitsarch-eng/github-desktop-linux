[project]
name = "github-desktop-gtk"
version = "3.5.4"
description = "Native GTK 4 + libadwaita GitHub Desktop for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitHub Desktop contributors" }]

[project.scripts]
github-desktop = "github_desktop.__main__:main"
github = "github_desktop.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["github_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
