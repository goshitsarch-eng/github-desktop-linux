[project]
name = "github-desktop-qt"
version = "3.5.4"
description = "Native Qt 6 + Kirigami GitHub Desktop for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitHub Desktop contributors" }]

dependencies = ["PySide6>=6.6"]

[project.scripts]
github-desktop = "github_desktop.__main__:main"
github = "github_desktop.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["github_desktop*"]

[tool.setuptools.package-data]
github_desktop = ["ui/emoji_data.json", "ui/qml/**/*.qml", "ui/qml/**/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
